    <!-- Restore the deep-linked path after the GitHub Pages 404 bounce. -->
    <script>
      (function () {
        var r = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (r && r !== location.href) history.replaceState(null, "", r);
      })();
    </script>

    <!-- Settle theme and language before first paint, so neither one flashes. -->
    <script>
      (function () {
        var d = document.documentElement;
        try {
          var t = localStorage.getItem("theme") === "dark" ? "dark" : "light";
          d.setAttribute("data-theme", t);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", t === "dark" ? "#12110D" : "#F7F4EE");

          var seg = location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0];
          var l =
            seg === "fa" || seg === "en"
              ? seg
              : localStorage.getItem("lang") ||
                ((navigator.language || "en").toLowerCase().indexOf("fa") === 0 ? "fa" : "en");
          l = l === "fa" ? "fa" : "en";
          d.setAttribute("lang", l);
          d.setAttribute("dir", l === "fa" ? "rtl" : "ltr");
        } catch (e) {}
      })();
    </script>
