    <!-- Self-hosted, so no third-party CSS blocks the first paint. -->
    <link rel="preload" href="/fonts/mona-sans-latin.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Restore the deep-linked path after the GitHub Pages 404 bounce. -->
    <script>
      (function () {
        try {
          var r = sessionStorage.redirect;
          delete sessionStorage.redirect;
          if (r && r !== location.href) history.replaceState(null, "", r);
        } catch (e) {}
      })();
    </script>

    <!--
      Settle theme and language before first paint, so neither flashes.
      Theme: the visitor's stored choice, else the OS preference, else dark.
    -->
    <script>
      (function () {
        var d = document.documentElement;
        var stored = null;
        try {
          stored = localStorage.getItem("theme");
        } catch (e) {}
        var t =
          stored === "light" || stored === "dark"
            ? stored
            : window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
        d.setAttribute("data-theme", t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", t === "dark" ? "#0c1714" : "#eff3ee");

        var seg = location.pathname.replace(/^\/+|\/+$/g, "").split("/")[0];
        var l = seg === "fa" || seg === "en" ? seg : null;
        if (!l) {
          try {
            l = localStorage.getItem("lang");
          } catch (e) {}
        }
        if (l !== "fa" && l !== "en") {
          l = (navigator.language || "en").toLowerCase().indexOf("fa") === 0 ? "fa" : "en";
        }
        d.setAttribute("lang", l);
        d.setAttribute("dir", l === "fa" ? "rtl" : "ltr");
        if (l === "fa") {
          var f = document.createElement("link");
          f.rel = "preload";
          f.as = "font";
          f.type = "font/woff2";
          f.crossOrigin = "anonymous";
          f.href = "/fonts/vazirmatn-arabic.woff2";
          document.head.appendChild(f);
        }
      })();
    </script>
