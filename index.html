      rel="stylesheet"
    />

    <!-- Restore deep-link path after the 404.html SPA redirect (GitHub Pages) -->
    <script>
      (function () {
        var r = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (r && r !== location.href) history.replaceState(null, "", r);
      })();
    </script>

    <!-- Set theme + language before paint to avoid a flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "dark";
          document.documentElement.setAttribute("data-theme", t);
          var l = localStorage.getItem("lang");
          if (!l) {
            var path = location.pathname.replace(/\/+$/, "").split("/").pop();
            l = path === "fa" || path === "en" ? path : (navigator.language || "en").slice(0, 2);
          }
          l = l === "fa" ? "fa" : "en";
          document.documentElement.setAttribute("lang", l);
          document.documentElement.setAttribute("dir", l === "fa" ? "rtl" : "ltr");
        } catch (e) {}
      })();
    </script>

    <link
      rel="alternate"
      hreflang="en"
      href="https://mohamad-liyaghi.ir/en"
    />
    <link
      rel="alternate"
      hreflang="fa"
      href="https://mohamad-liyaghi.ir/fa"
    />
  </head>
  <body>
    <div id="root"></div>

  </body>
